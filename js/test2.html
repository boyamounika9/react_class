<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="root-tag">

    </div>
    <script>
        let list=["mounika","manasa","mallika"]
       
        let root= document.getElementById('root-tag');
        let h1tag=document.createElement('h1');
        h1tag.textContent="Hello i am from js";
        root.append(h1tag);

        let ulist=document.createElement('ul');
       

         list.forEach((e)=>{
             let listitem=document.createElement('li');
        listitem.textContent=e;
        ulist.append(listitem);
        })

        root.append(ulist)

    </script>
</body>
</html>
